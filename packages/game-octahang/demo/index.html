<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Octahang – og-octahang Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* The host page owns the background — the component is a self-contained box,
       so this demo uses a flat surface and simply centres the game the way a
       modal/panel would. */
    :root {
      --page-bg: #b0b8bdc5;
      --page-fg: #64748b;
      --panel-line: #94a3b8;
      --panel-fill: rgba(100, 116, 139, .1);
    }
    body.theme-dark {
      --page-bg: #0f172a;
      --page-fg: #94a3b8;
      --panel-line: #334155;
      --panel-fill: rgba(148, 163, 184, .08);
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 1.1rem;
      background: var(--page-bg);
      color: var(--page-fg);
      font-family: 'Inter', system-ui, sans-serif;
      padding: 1.75rem 1.25rem 3rem;
      transition: background .2s ease, color .2s ease;
    }
    @supports (justify-content: safe center) {
      body { justify-content: safe center; }
    }

    header { text-align: center; }
    header h1 {
      font-size: .95rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      opacity: .65;
    }

    /* Stand-in for the platform modal the game will really live inside:
       a container that hugs the component with empty margins around it.
       The component has no width of its own — it fills this box, so this is
       the single knob that sets how large the game reads on the page. */
    .modal-shell {
      width: 100%;
      max-width: 600px;
    }

    og-octahang {
      /* Only --og-font is themed by the page here; the component supplies its
         own light/dark palette via the theme attribute below. */
      --og-font: 'Inter', system-ui, sans-serif;
      display: block;
      width: 100%;
    }

    /* #controls is projected into the game's own "host-controls" slot, right
       next to its built-in theme toggle — on the idle/start screen and then in
       the HUD once play begins. Compact pill buttons fit both. */
    #controls { display: flex; gap: .35rem; }
    #controls button {
      cursor: pointer;
      border: 1px solid var(--panel-line);
      background: var(--panel-fill);
      color: inherit;
      border-radius: 999px;
      padding: .3rem .55rem;
      font-family: inherit;
      font-size: .75rem;
      font-weight: 600;
      transition: background .15s, border-color .15s, opacity .15s;
    }
    #controls button:hover { opacity: .75; }

    #mode-hint {
      width: 100%;
      max-width: 600px; /* oyun kutusuyla aynı hizada dursun */
      margin: -0.25rem 0 0;
      font-size: .9rem;
      opacity: .75;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body class="theme-dark">
  <header>
    <h1>Octapull Games · Octahang</h1>
  </header>

  <div class="modal-shell">
    <og-octahang id="game" mode="levels" levelCount="8" theme="dark"></og-octahang>
  </div>
  <script>
    // Runs before the module script below, so attributes are correct by the
    // time the custom element upgrades.
    var savedMode = sessionStorage.getItem('octahang-mode');
    if (savedMode) document.getElementById('game').setAttribute('mode', savedMode);
    var savedTheme = sessionStorage.getItem('octahang-theme');
    if (savedTheme) {
      document.getElementById('game').setAttribute('theme', savedTheme);
      document.body.classList.toggle('theme-dark', savedTheme === 'dark');
    }
  </script>

  <p id="mode-hint">
    İpucu: Harfleri ekrandaki klavyeden seçebilir ya da doğrudan bilgisayarının
    klavyesinden yazabilirsin.
  </p>

  <div id="controls">
    <button id="toggle-mode">Mod: Seviyeler</button>
    <button id="toggle-mute">Ses: Açık 🔊</button>
  </div>

  <script type="module">
    import '../src/index.ts';

    const game = document.getElementById('game');

    // Restore state from sessionStorage between reloads (demo only — the
    // component itself never touches local storage).
    const saved = sessionStorage.getItem('octahang-state');
    if (saved) {
      try { game.state = JSON.parse(saved); } catch (_) {}
    }

    // #controls is projected into the game's own "host-controls" slot from the
    // start: next to the built-in theme toggle on the idle screen first, then
    // inside the HUD once play begins (same slot, so it stays put).
    const controls = document.getElementById('controls');
    controls.setAttribute('slot', 'host-controls');
    game.appendChild(controls);

    // The hint only makes sense before play begins — hide it once a round starts.
    const modeHint = document.getElementById('mode-hint');
    game.addEventListener('og-level-start', () => { modeHint.style.display = 'none'; }, { once: true });

    game.addEventListener('og-state-change', (e) => {
      sessionStorage.setItem('octahang-state', JSON.stringify(e.detail.state));
    });

    // The theme toggle lives inside the game; the page mirrors it so the whole
    // surface flips together instead of just the game card.
    game.addEventListener('og-theme-change', (e) => {
      document.body.classList.toggle('theme-dark', e.detail.theme === 'dark');
      sessionStorage.setItem('octahang-theme', e.detail.theme);
    });

    const modeBtn = document.getElementById('toggle-mode');
    const muteBtn = document.getElementById('toggle-mute');

    function updateModeButton() {
      modeBtn.textContent = game.mode === 'levels' ? 'Mod: Seviyeler' : 'Mod: Rastgele';
    }
    function updateMuteButton() {
      muteBtn.textContent = game.muted ? 'Ses: Kapalı 🔇' : 'Ses: Açık 🔊';
    }

    updateModeButton();
    updateMuteButton();

    modeBtn.addEventListener('click', () => {
      sessionStorage.removeItem('octahang-state');
      sessionStorage.setItem('octahang-mode', game.mode === 'levels' ? 'random' : 'levels');
      location.reload();
    });

    muteBtn.addEventListener('click', () => {
      game.muted = !game.muted;
      updateMuteButton();
    });
  </script>
</body>
</html>
